upstream backend_upstream  { server backend:8000; }
upstream frontend_upstream { server frontend:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    gzip on;
    gzip_types application/json text/css application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /api/ { proxy_pass http://backend_upstream; }
    location ~ ^/(health|ready|docs|redoc|openapi\.json)$ { proxy_pass http://backend_upstream; }
    # /metrics is intentionally NOT exposed publicly.
    location / { proxy_pass http://frontend_upstream; }
}
